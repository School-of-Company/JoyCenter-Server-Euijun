spring:
  application:
    name: JoyCenter-Server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:joycenter_db}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: ${HIBERNATE_SQL_LOG:DEBUG}
    org.hibernate.type.descriptor.sql: ${HIBERNATE_PARAM_LOG:TRACE}

jwt:
  secret: ${JWT_SECRET:joycenter-local-jwt-secret}
  access-token-expire-time: ${JWT_ACCESS_EXPIRE:3600000}
  refresh-token-expire-time: ${JWT_REFRESH_EXPIRE:1209600000}
